<!doctype html>
<!-- `chat-hidden` is the boot state, statically: Panel opens on Home or on a project, never on
     Chat, and the class has to be on <html> before the first paint or the empty rail claims the
     work column for a frame. features/chat.ts owns it from mount onward. -->
<html lang="en" class="chat-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel</title>
    <!--
      Runs before the first paint so the boot screen already wears the right theme — no dark
      flash for a light-mode user, no light flash for a dark one. Source of truth is the saved
      choice; absent that, the OS preference. main.ts reads the same attribute afterward.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("panel-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <!--
      Same pre-paint trick for the sidebar width: a collapsed rail must be collapsed on frame
      one. <body> does not exist yet while <head> runs, so the class rides on <html> and every
      compact rule in style.css keys off html.sidebar-compact. main.ts flips the same class.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("panel-sidebar-compact") === "1") {
            document.documentElement.classList.add("sidebar-compact");
          }
        } catch (e) {
          /* expanded is the safe default */
        }
      })();
    </script>
    <!--
      This is deliberately inline. The app stylesheet arrives with the JavaScript bundle, so
      without a few critical rules the webview briefly paints the raw document while Panel is
      still discovering its projects. Keep this screen dependency-free and cheaper than the app
      it covers. The light overrides mirror the light tokens in style.css so boot matches app.
    -->
    <style>
      :root { color-scheme: dark; }
      html[data-theme="light"] { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: #070910; }
      html[data-theme="light"], html[data-theme="light"] body { background: #eef1f6; }
      body.panel-booting { overflow: hidden; }
      body.panel-booting #app { opacity: 0; }
      #app { opacity: 1; transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1); }

      /* The opening: deep space, stars streaming past, the lockup riding the middle of it.
         Pure canvas + CSS — the splash must stay cheaper than the app it covers. */
      .panel-boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(120% 120% at 50% 42%, #0c1020 0%, #070910 55%, #04050b 100%);
        color: #d8deea;
        font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 360ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 360ms;
      }
      body.panel-ready .panel-boot { opacity: 0; visibility: hidden; }
      .panel-boot-stars {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transition: opacity 240ms ease;
      }
      /* Mark and name sit side by side; the message and Retry wrap to full-width lines below, so
         a long error can never push the mark away from the name. */
      .panel-boot-lockup {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        max-width: 440px;
        gap: 10px;
        transform: translateY(-2vh);
        animation: panel-boot-float 4.5s ease-in-out infinite alternate;
      }
      @keyframes panel-boot-float {
        from { transform: translateY(-2vh); }
        to   { transform: translateY(calc(-2vh - 7px)); }
      }
      .panel-boot-mark {
        width: 34px;
        height: 34px;
        overflow: hidden;
        border-radius: 11px;
        box-shadow: 0 0 0 1px rgba(154, 136, 255, 0.4), 0 0 22px rgba(154, 136, 255, 0.24);
        animation: panel-boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .panel-boot-mark img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .panel-boot-name small {
        display: block;
        color: #6d78a0;
        font-size: 11px;
        letter-spacing: 0.14em;
      }
      .panel-boot-name b { display: block; font-size: 14px; letter-spacing: -0.01em; }
      .panel-boot-message {
        flex-basis: 100%;
        margin-top: 9px;
        color: #8b96b5;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-align: center;
        animation: panel-boot-breathe 1.8s ease-in-out infinite alternate;
      }
      @keyframes panel-boot-breathe {
        from { opacity: 0.55; }
        to   { opacity: 1; }
      }
      .panel-boot.is-error .panel-boot-stars { opacity: 0.18; }
      .panel-boot.is-error .panel-boot-lockup { animation: none; }
      .panel-boot.is-error .panel-boot-mark { box-shadow: 0 0 0 1px rgba(255, 107, 129, 0.7), 0 0 22px rgba(255, 107, 129, 0.25); }
      .panel-boot.is-error .panel-boot-message {
        max-width: 420px;
        color: #ff9aaa;
        line-height: 1.45;
        white-space: pre-wrap;
        text-transform: none;
        letter-spacing: 0.04em;
        font-size: 11px;
        animation: none;
      }
      .panel-boot .error-note {
        flex-basis: 100%;
        margin-top: 9px;
        color: #ff9aaa;
        font-size: 12px;
        text-align: center;
      }
      html[data-theme="light"] .panel-boot .error-note { color: #b02a3d; }
      .panel-boot-retry {
        padding: 7px 14px;
        color: inherit;
        background: rgba(154, 136, 255, 0.12);
        border: 1px solid rgba(154, 136, 255, 0.4);
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      .panel-boot-retry[hidden] { display: none; }
      @keyframes panel-boot-rise {
        from { opacity: 0; transform: scaleY(0.35); }
        to { transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app, .panel-boot { transition: none; }
        .panel-boot-mark,
        .panel-boot-lockup,
        .panel-boot-message { animation: none; }
      }
      /* Light boot — dawn instead of deep night, same sky. */
      html[data-theme="light"] .panel-boot {
        background: radial-gradient(120% 120% at 50% 42%, #f6f8fd 0%, #eef1f6 60%, #e3e8f2 100%);
        color: #1c2333;
      }
      html[data-theme="light"] .panel-boot-mark { box-shadow: 0 0 0 1px rgba(106, 82, 230, 0.35), 0 0 18px rgba(106, 82, 230, 0.18); }
      html[data-theme="light"] .panel-boot-name small { color: #7e889c; }
      html[data-theme="light"] .panel-boot-message { color: #5b6684; }
      html[data-theme="light"] .panel-boot.is-error .panel-boot-mark { box-shadow: 0 0 0 1px rgba(196, 46, 68, 0.65); }
      html[data-theme="light"] .panel-boot.is-error .panel-boot-message { color: #b02a3d; }
    </style>
  </head>
  <body class="panel-booting">
    <div id="panelBoot" class="panel-boot" role="status" aria-live="polite">
      <canvas id="panelBootStars" class="panel-boot-stars" aria-hidden="true"></canvas>
      <div class="panel-boot-lockup">
        <span class="panel-boot-mark" aria-hidden="true"><img src="/assets/panel-wolf-mark.webp" alt="" /></span>
        <span class="panel-boot-name"><small>APPGEA</small><b>Panel</b></span>
        <span id="panelBootMessage" class="panel-boot-message">Entering the panel…</span>
        <button id="panelBootRetry" class="panel-boot-retry" type="button" hidden>Retry</button>
      </div>
    </div>
    <!--
      The warp field. Stars stream outward from a point just above centre, gathering speed as
      the app loads underneath. Inline and dependency-free like everything else on this screen;
      the loop dies on its own the moment main.ts removes #panelBoot after the fade.
    -->
    <script>
      (function () {
        var canvas = document.getElementById("panelBootStars");
        if (!canvas || !canvas.getContext) return;
        var ctx = canvas.getContext("2d");
        var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        var light = document.documentElement.getAttribute("data-theme") === "light";
        // Dark night gets white-violet stars; light dawn gets violet ink at low alpha.
        var hues = light ? ["106,82,230", "91,102,132", "125,77,216"] : ["216,222,234", "154,136,255", "99,213,200"];
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        var w = 0, h = 0, cx = 0, cy = 0, maxR = 0;

        function size() {
          w = canvas.clientWidth; h = canvas.clientHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          cx = w / 2; cy = h * 0.42; /* the lockup's sky — stars radiate from behind it */
          maxR = Math.hypot(w, h) / 2 + 40;
        }
        size();
        window.addEventListener("resize", size);

        var COUNT = 150;
        var stars = [];
        for (var i = 0; i < COUNT; i++) {
          var angle = (i / COUNT) * Math.PI * 2 + (i % 7) * 0.83;
          stars.push({
            cos: Math.cos(angle), sin: Math.sin(angle),
            z: ((i * 73) % 1000) / 1000,        /* staggered depths so frame one is full */
            hue: hues[i % hues.length],
            big: i % 11 === 0,                   /* a few heroes, brighter and thicker */
          });
        }

        function frame(z) { return Math.pow(z, 2.2) * maxR; }

        var start = performance.now();
        function tick(now) {
          if (!canvas.isConnected || canvas.closest(".is-error")) return;
          ctx.clearRect(0, 0, w, h);
          /* Ease into warp: gentle for the first beat, then cruising. */
          var v = 0.0035 + Math.min((now - start) / 3200, 1) * 0.0075;
          for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            var r0 = frame(s.z);
            s.z += v * (0.25 + s.z * 2.6);
            if (s.z >= 1) { s.z = 0.02 + (i % 10) * 0.004; r0 = frame(s.z); }
            var r1 = frame(s.z);
            var a = Math.min(1, s.z * 1.6) * (s.big ? 0.95 : 0.6);
            ctx.strokeStyle = "rgba(" + s.hue + "," + a.toFixed(3) + ")";
            ctx.lineWidth = (s.big ? 2 : 1.1) * (0.4 + s.z);
            ctx.beginPath();
            ctx.moveTo(cx + s.cos * r0, cy + s.sin * r0);
            ctx.lineTo(cx + s.cos * r1, cy + s.sin * r1);
            ctx.stroke();
          }
          requestAnimationFrame(tick);
        }

        if (reduced) {
          /* No motion: one still sky — dots, not streaks. */
          ctx.clearRect(0, 0, w, h);
          for (var j = 0; j < stars.length; j++) {
            var st = stars[j];
            var r = frame(0.15 + st.z * 0.8);
            ctx.fillStyle = "rgba(" + st.hue + ",0.5)";
            ctx.beginPath();
            ctx.arc(cx + st.cos * r, cy + st.sin * r, st.big ? 1.6 : 1, 0, Math.PI * 2);
            ctx.fill();
          }
          return;
        }
        requestAnimationFrame(tick);
      })();
    </script>
    <main id="app">
      <!-- SIDEBAR: the portfolio. This is the main navigation. -->
      <aside class="sidebar">
        <header class="brand">
          <span class="brand-mark" aria-hidden="true"><img src="/assets/panel-wolf-mark.webp" alt="" /></span>
          <span><small>APPGEA</small><b>Panel</b></span>
          <button id="sidebarToggle" class="ghost sidebar-toggle" type="button"
                  aria-label="Collapse sidebar" aria-pressed="false" title="Collapse sidebar">‹</button>
        </header>

        <!-- HOME stands alone, above the workspace. It is the portfolio's landing, not a tab of
             the work area, so it has its own screen, its own lit state, and NO digit chord —
             the ⌘ ladder belongs to the workspace strip and nothing else. -->
        <nav id="homeNav" class="side-nav home-nav" aria-label="Home">
          <button id="homeButton" class="nav-row" type="button" title="Home">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.6 12 3l9 7.6v9.1a1.3 1.3 0 0 1-1.3 1.3H4.3A1.3 1.3 0 0 1 3 19.7Z"/><path d="M9 21v-7h6v7"/></svg></span> Home
          </button>
        </nav>


        <!-- Portfolio level: the Workspace, and the two doors into it. Runs and the terminal wall
             are tabs of ONE screen, so the lit state belongs to the group — the whole area is
             where you are, or Home is, or a project is. The rows are shortcuts to a tab inside it,
             never separate places. The strip within is ⌘1…⌘9; ⌘⇧W is the door. -->
        <nav id="workspaceNav" class="side-nav" aria-label="Workspace">
          <span class="side-label side-nav-label"><span>WORKSPACE</span></span>
          <button id="runButton" class="nav-row" type="button" title="Runs">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg></span> Runs
          </button>
          <button id="terminalsButton" class="nav-row" type="button" title="Terminals">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 7 4 4-4 4"/><path d="M11 17h8"/><rect x="2.5" y="3" width="19" height="18" rx="3"/></svg></span> Terminals
          </button>
        </nav>

        <!-- Chat is a place again — a screen, like Home and Settings. It was a column of the
             shell, and the column was too narrow for what lands in it: screenshots, replays and a
             live manager terminal. Esc gives the previous screen straight back. It sits under the
             Workspace: the work area is what you reach for first. -->
        <nav id="chatNav" class="side-nav chat-nav" aria-label="Inbox">
          <span class="side-label side-nav-label"><span>INBOX</span></span>
          <button id="chatButton" class="nav-row" type="button" title="Agent reports · ⌘⇧C" aria-pressed="false">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 3z"/></svg></span>
            Reports <span id="chatBadge" class="nav-badge" hidden>0</span>
          </button>
          <!-- The manager gets its own door. It is the one participant you go TO rather than hear
               FROM, so it is a row and not a filter on the feed. -->
          <button id="cpoButton" class="nav-row" type="button" title="Manager · Plan work with an agent · ⌘⇧M" aria-pressed="false">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m8 10 2.5 2L8 14"/><path d="M13 14h3"/></svg></span>
            Manager <span id="cpoState" class="nav-badge nav-state" hidden></span>
          </button>
          <!-- The other inbox: what the people using the apps sent in. Eleven apps publish a
               support form, and until this row existed every one of them landed in a spreadsheet
               nobody opened. It sits here because reading it is the same act as reading Inbox —
               one is what the agents said, the other is what the users said. -->
          <button id="supportButton" class="nav-row" type="button" title="Support">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg></span>
            Support <span id="supportBadge" class="nav-badge" hidden>0</span>
          </button>
          <!-- What the agents made: renders, screenshots, sounds. Files an agent saves without
               sending a report land here too, so reviewing never starts in Finder. -->
          <button id="reviewButton" class="nav-row" type="button" title="Review what agents made">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="m4 16 5-5 4 4 2-2 5 5"/><circle cx="15.5" cy="9" r="1.5"/></svg></span>
            Review <span id="reviewBadge" class="nav-badge" hidden>0</span>
          </button>
        </nav>

        <!-- Project memory and private notes. -->
        <nav id="planNav" class="side-nav plan-nav" aria-label="Desk">
          <span class="side-label side-nav-label"><span>DESK</span></span>
          <button id="sprintButton" class="nav-row" type="button" title="Project desk">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h9"/><path d="M4 18h6"/><path d="m14 16 2.5 2.5L21 14"/></svg></span> Project desk
          </button>
          <button id="notebookButton" class="nav-row" type="button" title="Notebook">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3.5h11.5A1.5 1.5 0 0 1 19 5v15.5H6A2 2 0 0 1 4 18.5v-13a2 2 0 0 1 2-2Z"/><path d="M7 3.5v17M10 8h6M10 12h6"/></svg></span>
            Notebook
          </button>
        </nav>

        <section id="projectsSection" class="side-section projects-section">
          <div class="project-filter">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            <input id="projectFilter" type="search" placeholder="Filter projects" autocomplete="off"
                   spellcheck="false" aria-label="Filter projects" />
          </div>
          <!-- The order of this list is the user's, never the app's. The two chips are what
               replaces auto-sorting: "live" answers where the work is on demand, the order chip
               says (and changes) the rule the list obeys. -->
          <div class="side-label projects-label">
            <span id="projectsLabel">PROJECTS</span>
            <button id="projectLive" class="live-chip" type="button" hidden aria-pressed="false"
                    title="Show only projects with a live agent"><i></i><b>0</b></button>
            <button id="projectSort" class="sort-chip" type="button"
                    title="Order: manual — drag rows to arrange">Manual</button>
            <span id="projectCount">0</span>
          </div>
          <div id="projectList" class="project-list"></div>
          <!-- The rail shows the five you last worked in; everything else lives behind this one
               button. The count is what is still hidden, and it is all the compact rail shows. -->
          <button id="projectShowAll" class="ghost show-all" type="button" hidden
                  aria-controls="projectList" aria-expanded="false">
            <span class="show-all-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
            </span>
            <span class="show-all-text"><b>Show all</b><small>0 more</small></span>
          </button>
          <button id="addProject" class="ghost add-project" type="button" aria-label="Add project">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>
            <span>Add project</span>
          </button>
        </section>

        <footer class="side-foot">
          <span class="side-foot-right">
            <button id="settingsButton" class="ghost theme-toggle" type="button"
                    aria-label="Settings" title="Settings (⌘,)">
              <svg viewBox="0 0 24 24" aria-hidden="true" width="15" height="15" fill="none"
                   stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10.3 3.2h3.4l.5 2.3 1.6.9 2.2-.8 1.7 2.9-1.8 1.6v1.8l1.8 1.6-1.7 2.9-2.2-.8-1.6.9-.5 2.3h-3.4l-.5-2.3-1.6-.9-2.2.8-1.7-2.9 1.8-1.6v-1.8L4.3 8.5 6 5.6l2.2.8 1.6-.9z" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6"/></svg>
            </button>
            <button id="themeToggle" class="ghost theme-toggle" type="button"
                    aria-label="Toggle light / dark theme" title="Toggle light / dark theme">◐</button>
            <span class="health" title="Panel is running locally"><span class="health-dot"></span> Local</span>
          </span>
        </footer>
      </aside>

      <!-- CHAT: the conversation, as a screen. It swaps with the workspace, Home, Settings or the
           project chrome exactly as they swap with each other, and hands back whatever it took on
           Esc. Opened by the Chat row above, or ⌘⇧C. -->
      <aside id="chatRail"></aside>

      <!-- Human-only Markdown notes. This screen never receives project or agent context. -->
      <section id="notebookScreen" class="notebook" hidden></section>

      <!-- WORKSPACE: the portfolio's work area. It swaps with the project chrome below. One
           tab strip over Runs and every live PTY; the deck LENDS it every pane's mount
           while it is up — it owns none of them. -->
      <section id="terminalsScreen" class="terminals" hidden></section>

      <!-- HOME: the portfolio's cards, and a screen of its own. It swaps with the workspace or
           the project chrome the same way Settings does — it is not a tab of anything. -->
      <section id="homeScreen" class="home" hidden></section>
      <section id="sprintScreen" class="sprint" hidden></section>

      <!-- SUPPORT: every app's support form, read into one queue. Portfolio-wide like Home —
           the queue is one queue, and splitting it per project would make eleven of it. -->
      <section id="supportScreen" class="support" hidden></section>
      <section id="reviewScreen" class="review" hidden></section>

      <!-- RUN: the simulator system. Runs are processes with verbs (run / r / R / stop), not
           terminals — their PTYs never join the deck or the wall. Parks here and is moved into
           the workspace strip as tab 1. -->
      <!-- (The Inbox screen used to sit here. Its conversation is the chat rail above; its
           cross-project archive is Home's activity strip.) -->
      <section id="runScreen" class="run" hidden></section>

      <!-- SETTINGS: a screen of its own, not a sheet. It swaps with whatever was up — the
           workspace or a project — and hands that screen back on the way out. -->
      <section id="settingsScreen" class="settings" hidden></section>

      <!-- SCRATCH: the desk. A screen like Home and Settings — it swaps with whatever was up and
           hands that screen back on the way out. -->

      <!-- MAIN: scoped to the selected project. -->
      <section class="main">
        <!--
          THE MODULE RAIL. One strip, one shape, every door into this project sitting in it.

          It used to be three tabs, a ghost button off in the actions (Product Spine), and a module
          that was not on the screen at all (Release) — so nothing on the head read as "these are
          the modules". Now they are segments of one rail, flush, each wearing its own hue, and
          the project they belong to is named at the left end of it.

          Terminal sessions have their own strip immediately above the terminal screen below.
          Keeping it out of this header makes it clear those tabs switch terminals, not modules.
        -->
        <header class="main-head">
          <div class="modrail">
            <div class="project-title">
              <b id="projectName">—</b>
              <small id="projectBranch"></small>
            </div>

            <nav class="mtabs" role="tablist" aria-label="Modules">
              <!-- FIRST, and where a project opens. Selecting an app is a decision to work on
                   it, and the work happens in a PTY — a summary screen is what you want after
                   the fact, not as the greeting. This tab hands the terminal zone the whole
                   screen and adds the two things a terminal cannot do to itself: start another
                   one, and run the app. -->
              <button id="tabTerminals" class="mtab m-term is-active" role="tab" type="button"
                      aria-selected="true" title="This project's terminals — and run the app">
                <i class="mtab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 7 4 4-4 4"/><path d="M11 17h8"/><rect x="2.5" y="3" width="19" height="18" rx="3"/></svg></i>
                <span class="mtab-name">Terminals</span>
                <span id="terminalsBadge" class="badge" hidden></span>
              </button>
              <button id="tabGit" class="mtab m-git" role="tab" type="button"
                      aria-selected="false" title="Review changes, commit, sync and recover safely">
                <i class="mtab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6 7v10M8 9c3.5 0 3.7-3 8-3"/></svg></i>
                <span class="mtab-name">Git</span>
                <i id="gitDot" class="mtab-dot" title="this repo is carrying unpushed work" hidden></i>
              </button>
              <button id="tabDash" class="mtab m-dash" role="tab" type="button"
                      aria-selected="false" title="Where this project stands">
                <i class="mtab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></i>
                <span class="mtab-name">Dashboard</span>
                <span id="dashBadge" class="badge" hidden></span>
              </button>
              <button id="tabFiles" class="mtab m-work" role="tab" type="button"
                      aria-selected="false" title="Browse and edit project files">
                <i class="mtab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 10h6M9 14h6M9 18h4"/></svg></i>

              </button>
              <button id="tabDebug" class="mtab m-debug" role="tab" type="button"

                <span class="mtab-name">Debug</span>
              </button>
              <button id="tabProductSpine" class="mtab m-spine" role="tab" type="button"
                      aria-selected="false" title="What the product does, where it can fail, and what changed">
                <i class="mtab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M8.5 5.2 12 7l3.5-1.8M8.5 9.2 12 11l3.5-1.8M8.5 13.2 12 15l3.5-1.8M8.5 17.2 12 19l3.5-1.8"/></svg></i>
                <span class="mtab-name">Product Spine</span>
              </button>
              <button id="tabRelease" class="mtab m-rel" role="tab" type="button"
                      aria-selected="false" title="What is live, and what is waiting to ship">
                <i class="mtab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 4c3.7.5 5.5 2.3 6 6l-6.5 6.5-6-6Z"/><path d="m9.5 12.5-3.3.7L3 16.4l4.6.5M11.5 14.5l-.7 3.3L7.6 21l-.5-4.6"/><circle cx="15.5" cy="8.5" r="1.5"/></svg></i>
                <span class="mtab-name">Release</span>
              </button>
              <button id="tabRevenueCat" class="mtab m-rc" role="tab" type="button"
                      aria-selected="false" title="Product revenue, subscribers and trials" hidden>
                <i class="mtab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-4 3 2 5-6"/><path d="M15 7h4v4"/></svg></i>
                <span class="mtab-name">RevenueCat</span>
              </button>
              <button id="tabAnalytics" class="mtab m-an" role="tab" type="button"
                      aria-selected="false" title="Firebase / GA4 health across every app, ranked">
                <i class="mtab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><rect x="7" y="12" width="3" height="5"/><rect x="12" y="8" width="3" height="9"/><rect x="17" y="5" width="3" height="12"/></svg></i>
                <span class="mtab-name">Analytics</span>
              </button>
            </nav>

            <div class="main-actions">
              <span id="startAgentError" class="start-agent-error" role="status" hidden></span>
              <button id="openProjectFolder" class="ghost" type="button">Open folder</button>
              <button id="startAgent" type="button">Start agent</button>
            </div>
          </div>
        </header>

        <div class="main-panes">
          <section id="terminalsTabPane" class="pane terms-pane" aria-label="Terminals">
            <section id="terminalZone" class="terminal-zone">
              <div id="sessionStrip" class="sessionstrip"></div>
              <div id="terminalHost" class="terminal-host">
                <div id="terminalEmpty" class="terminal-empty" hidden>
                  <b>No terminal on this project yet</b>
                  <button id="terminalEmptyStart" type="button">Start Claude</button>
                  <small>Or pick any agent in the NEW row above.</small>
                </div>
              </div>
            </section>
          </section>
          <section id="dashPane" class="pane dash-pane" aria-label="Dashboard" hidden></section>
          <section id="filesPane" class="pane files-pane" aria-label="Working set" hidden></section>
          <section id="debugPane" class="pane debug-pane" aria-label="Debugger" hidden></section>
          <section id="gitPane" class="pane git-pane" aria-label="Git" hidden></section>
          <section id="productSpinePane" class="pane product-spine-pane" aria-label="Product Spine" hidden></section>
          <section id="releasePane" class="pane release-pane" aria-label="Release" hidden></section>
          <section id="revenueCatPane" class="pane revenuecat-pane" aria-label="RevenueCat" hidden></section>
          <section id="analyticsPane" class="pane analytics-pane" aria-label="Analytics" hidden></section>
        </div>


      </section>

    </main>
    <script type="module" src="/src/main.ts"></script>
