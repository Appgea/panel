# Panel Live's view, drawn by Bevy and built to WebAssembly for the Live section.
# Its own workspace, so the desktop workspace's `cargo check` never compiles Bevy.
# Built by `ui/scripts/build-live.mjs` into `ui/public/live/`.
[package]
name = "panel-live"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 0.19, not 0.20: 0.20 needs rustc 1.97, and moving this Mac's shared toolchain rebuilds every
# session's target folder at once.
bevy = { version = "0.19.1", default-features = false, features = [
  # Only what the view draws with. The `2d` bundles add animation, gizmos, picking, state and
  # reflection auto-registration, which tripled the wasm file.
  "std",
  "bevy_asset",
  "bevy_log",
  "bevy_winit",
  "bevy_window",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_sprite_render",
  "webgl2",
  "web",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
# Debug info only: wasm-bindgen reads the target_features section that a full strip drops.
strip = "debuginfo"
panic = "abort"

# Bevy's own crates optimized even in dev, so a debug build still draws at frame rate.
[profile.dev.package."*"]
opt-level = 2
