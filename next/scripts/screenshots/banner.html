<!doctype html>
<!-- The README banner. capture.mjs renders it after the app shots, because it shows hero.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appgea Panel banner</title>
<style>
  /* The app's dark theme tokens, from ui/src/style.css. */
  :root {
    --bg: #070910;
    --ink: #d8deea;
    --ink-dim: #7f8ba3;
    --accent: #9a88ff;
    --line: #1b2233;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(640px 420px at 18% 30%, #9a88ff26, transparent 70%),
      radial-gradient(520px 380px at 92% 100%, #4fd1c51a, transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
    position: relative;
  }
  .copy { position: absolute; left: 72px; top: 110px; width: 500px; }
  .lockup { display: flex; align-items: center; gap: 22px; }
  .lockup img { width: 112px; height: 112px; filter: drop-shadow(0 18px 30px #00000080); }
  .eyebrow {
    font-size: 17px; font-weight: 600; letter-spacing: 0.32em; color: var(--ink-dim);
    text-transform: uppercase;
  }
  .name { font-size: 64px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; margin-top: 6px; }
  .pitch { margin-top: 40px; font-size: 27px; line-height: 1.35; color: var(--ink); font-weight: 500; }
  .pitch span { color: var(--accent); }
  .meta { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 520px; }
  .chip {
    font-size: 15px; font-weight: 600; color: var(--ink-dim); padding: 7px 13px;
    border: 1px solid var(--line); border-radius: 999px; background: #0c101acc; white-space: nowrap;
  }
  .shot {
    position: absolute; left: 600px; top: 86px; width: 860px;
    border-radius: 14px; overflow: hidden;
    border: 1px solid #2a2f45;
    box-shadow: 0 40px 90px #000000b3, 0 0 0 1px #9a88ff22, 0 0 80px #9a88ff1f;
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="lockup">
      <img src="../../apps/desktop/src-tauri/icons/icon.png" alt="">
      <div>
        <div class="eyebrow">Appgea</div>
        <div class="name">Panel</div>
      </div>
    </div>
    <p class="pitch">Every coding agent, every project,<br>one window.<br><span>See which one needs you.</span></p>
    <div class="meta">
      <span class="chip">macOS · Windows</span>
      <span class="chip">Claude · Codex · Grok · opencode</span>
      <span class="chip">MIT</span>
    </div>
  </div>
  <div class="shot"><img src="../../../docs/screenshots/hero.png" alt=""></div>
</body>
</html>
