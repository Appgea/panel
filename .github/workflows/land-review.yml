# The cloud half of `land` (Appgea ops runbooks/land.py). A session with the pr_flow flag on pushes a
# land/<sha> branch and opens a PR whose body is the review prompt plus the ask. This job adds the diff,
# runs Claude Code on API credits, and comments. land waits for the comment that carries its head sha.
name: land review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: land-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # pull_request from a fork gets no secrets, and its body is not ours to run as a prompt.
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'land/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # No token left in .git/config for the reviewer to read.
          persist-credentials: false
      - name: Prompt
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/prompt"
          printf '\n=== THE DIFF ===\n' >> "$RUNNER_TEMP/prompt"
          git diff "$BASE...$HEAD" >> "$RUNNER_TEMP/prompt"
      # The API key is in this step only, with no GitHub token beside it. The reviewer gets read tools,
      # no shell and no web. Its text is checked for the key before anything is posted.
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx -y @anthropic-ai/claude-code@2.1.312 -p --model sonnet \
            --allowedTools "Read,Grep,Glob" \
            --disallowedTools "Edit,Write,NotebookEdit,Bash,WebFetch,WebSearch,Read(/proc/**),Read(/sys/**)" < "$RUNNER_TEMP/prompt" > "$RUNNER_TEMP/review"
          # land takes any marked comment as the finished review, so an empty one must never be posted.
          [ -s "$RUNNER_TEMP/review" ] || { echo "empty review"; exit 1; }
          if grep -qF "$ANTHROPIC_API_KEY" "$RUNNER_TEMP/review"; then echo "review text holds the key, not posting"; exit 1; fi
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo "<!-- land-review sha=$HEAD -->"; cat "$RUNNER_TEMP/review"; } > "$RUNNER_TEMP/comment"
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment"
