# The cloud half of `carry` (Appgea ops runbooks/carry.py). Sessions push to develop. When develop holds a
# finished whole, carry snapshots it as a carry/<sha> branch and opens a PR to main whose body is the review
# prompt plus the ask. This job adds the diff, runs Claude Code on API credits, and comments. carry waits for
# the comment that carries its head sha, then moves main to it.
name: carry review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: carry-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # pull_request from a fork gets no secrets, and its body is not ours to run as a prompt.
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'carry/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # No token left in .git/config for the reviewer to read.
          persist-credentials: false
      - name: Prompt
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # review.md says to read files for context. This run has no tools, so say so first, or the model
          # writes tool calls as text instead of a review (PR #9).
          printf '%s\n\n' "This run has no tools. You cannot read files or run commands. Judge from the diff below alone, and never write a tool call." > "$RUNNER_TEMP/prompt"
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json body --jq .body >> "$RUNNER_TEMP/prompt"
          printf '\n=== THE DIFF ===\n' >> "$RUNNER_TEMP/prompt"
          git diff "$BASE...$HEAD" >> "$RUNNER_TEMP/prompt"
      # The API key is in this step only, with no GitHub token beside it. The reviewer gets no tools at
      # all, so nothing it is told can reach the key: it judges the diff in the prompt and nothing else.
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "ANTHROPIC_API_KEY is not set on this repo"; exit 1; }
          npx -y @anthropic-ai/claude-code@2.1.312 -p --model sonnet --tools "" < "$RUNNER_TEMP/prompt" > "$RUNNER_TEMP/review"
          # carry takes any marked comment as the finished review, so an empty one must never be posted.
          [ -s "$RUNNER_TEMP/review" ] || { echo "empty review"; exit 1; }
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo "<!-- carry-review sha=$HEAD -->"; cat "$RUNNER_TEMP/review"; } > "$RUNNER_TEMP/comment"
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment"
