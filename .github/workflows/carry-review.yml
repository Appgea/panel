# The cloud half of `carry` (Appgea ops runbooks/carry.py). Sessions push to develop. When develop holds a
# finished whole, carry snapshots it as a carry/<sha> branch and opens a PR to main whose body is the review
# prompt plus the ask. This job adds the diff, runs Sonnet and Codex Sol on API credits, and posts one merged
# comment. carry waits for the comment that carries its head sha, then moves main to it.
# Two families, because most code here is written by Claude and Sonnet alone shares its blind spots.
name: carry review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: carry-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # pull_request from a fork gets no secrets, and its body is not ours to run as a prompt.
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'carry/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # No token left in .git/config for the reviewer to read.
          persist-credentials: false
      - name: Prompt
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # review.md says to read files for context. This run has no tools, so say so first, or the model
          # writes tool calls as text instead of a review (PR #9).
          printf '%s\n\n' "This run has no tools. You cannot read files or run commands. Judge from the diff below alone, and never write a tool call." > "$RUNNER_TEMP/prompt"
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json body --jq .body >> "$RUNNER_TEMP/prompt"
          printf '\n=== THE DIFF ===\n' >> "$RUNNER_TEMP/prompt"
          git diff "$BASE...$HEAD" >> "$RUNNER_TEMP/prompt"
      # Each API key is in its own step only, with no GitHub token beside it. The reviewers get no tools at
      # all, so nothing they are told can reach a key: each judges the diff in the prompt and nothing else.
      # A failed reviewer does not stop the job. Merge turns it into a finding, so carry stops instead of
      # passing on one review.
      - name: Review (Sonnet)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "ANTHROPIC_API_KEY is not set on this repo"; exit 1; }
          npx -y @anthropic-ai/claude-code@2.1.312 -p --model sonnet --tools "" < "$RUNNER_TEMP/prompt" > "$RUNNER_TEMP/review-sonnet"
      - name: Review (Sol)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          [ -n "$OPENAI_API_KEY" ] || { echo "OPENAI_API_KEY is not set on this repo"; exit 1; }
          jq -n --rawfile p "$RUNNER_TEMP/prompt" '{model: "gpt-6.1-sol", reasoning: {effort: "high"}, input: $p}' > "$RUNNER_TEMP/sol-req.json"
          curl -sS --fail-with-body --max-time 600 https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
            -d @"$RUNNER_TEMP/sol-req.json" > "$RUNNER_TEMP/sol-res.json" || { cat "$RUNNER_TEMP/sol-res.json"; exit 1; }
          jq -r '[.output[]? | select(.type == "message") | .content[] | select(.type == "output_text") | .text] | join("")' \
            "$RUNNER_TEMP/sol-res.json" > "$RUNNER_TEMP/review-sol"
      # carry passes only "No findings." plus "DESTRUCTIVE: none", so the merge keeps that exact shape. A missing,
      # empty or unshaped review becomes a finding: an empty comment must never read as a pass.
      - name: Merge
        run: |
          python3 - <<'EOF'
          import os, pathlib
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          findings, destructive = [], []
          for name in ("sonnet", "sol"):
              path = tmp / f"review-{name}"
              lines = [l.strip() for l in path.read_text().splitlines() if l.strip()] if path.exists() else []
              if not lines:
                  findings.append(f"[{name}] gave no review. See the Action log.")
                  continue
              if not lines[-1].startswith("DESTRUCTIVE:"):
                  findings.append(f"[{name}] review has no DESTRUCTIVE line, so it may be cut off.")
              for line in lines:
                  if line.startswith("DESTRUCTIVE:"):
                      what = line[len("DESTRUCTIVE:"):].strip()
                      if what not in ("none", "none."):
                          destructive.append(f"[{name}] {what}")
                  elif line != "No findings.":
                      findings.append(f"[{name}] {line}")
          out = (findings or ["No findings."]) + ["DESTRUCTIVE: " + ("; ".join(destructive) or "none")]
          (tmp / "review").write_text("\n".join(out) + "\n")
          EOF
          cat "$RUNNER_TEMP/review"
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo "<!-- carry-review sha=$HEAD -->"; cat "$RUNNER_TEMP/review"; } > "$RUNNER_TEMP/comment"
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment"
